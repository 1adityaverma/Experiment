var FILM=`<video class="vf" id="fv" src="silence-can-speak.mp4" controls playsinline preload="metadata" title="Silence Can Speak"></video><h1>Silence Can Speak.</h1><p>After winning a short film in an intercollegiate, the human vice called “ambition” took over me. And I soon convinced the team to make another one, because it was aching not to. And I learned, passion is contagious. Or to be precise, my passion.</p><p>We shot it in a day inside the campus, skipping our classes and I edited and surprised the team with the final product the next day. We shared it amongst friends, who we thought wouldn’t dismiss the idea of silent black and white, experimental film at the first glance.</p><p>One of them, stating ”What in the Slavic art film is this. Brilliant. It’s about expression. An aura of expression emanates from the character but is invisible to others. The world around him brings it out and because of that in a way sees the inanimate world does see it. Things complement it but nothing reacts to it. Mimesis of colorfulness in black and white.”</p><p>At the end, we were happy. With the fact that something can be done. At least, something.</p>`;

{n:"Claude",m:"g",L:`
t|Chosen Problem: “In October 2026, ChatGPT drew 55.7% of worldwide generative-AI website traffic and Claude 11.5%, according to Similarweb. Claude is consistently grabbing the lesser part of the pie, especially with general non tech population. It needs an edge over ChatGPT; without giving away its niche technical identity.
t|Strategy: AI confidently hallucinates and gives a wrong answer. Claude is visibly better than ChatGPT at saying that it doesn’t know, and that it is only guessing on highly uncertain topics. A clear important differentiation, and it should be highlighted.
t|Creative Insight: Admitting faults builds trust, whereas constant agreement (“yes-manning”) tends to erode it. If AI can demonstrate this kind of honesty, people will likely trust it more over time.
t|Solution: Tagline- “We know when we don’t,” coining Socrates’s “I know that I know nothing,” signifying self-awareness and limitations, rather than deluding folks.
n|Script theme

t|Problem: Newspapers are seen as an old technology. They are more effortful than mobile phones and culturally seen as outdated.
t|Insight: People like to associate with cool, aesthetic things.
t|Strategy: Make reading The Hindu the embodiment of a cool aesthetic ritual or practice to participate in.
t|Advantage: Most brands compete on inside-the-box metrics in the newspaper world like content reliability, trust etc.
t|Aesthetic framing for a newspaper is outside the box. The Hindu’s already established quality/reliability distinction over content (“written by journalists” campaign) can now, also take over the aesthetic experience of reading a newspaper.
h|Creative
t|“Newspapers aren’t cool anymore. Their readers always were.”
t|Insight: Cultural- we associate newspapers with uncles. So by association, if we made the uncle cool, that would transfer to The Hindu.
t|Psychological- How others see us while we read a newspaper, or how we imagine they see us, gives it an aesthetic value that a mobile phone cannot match.

{n:"Hinge",m:"g",L:`
h|Strategy
t|Though quantitative data is unavailable, but observationally, a lot of people using dating apps have already had at least one breakup or infatuation before.
t|So their current identity, as they use the apps, isn’t an isolated one. That context of “1)how they feel about themselves in the “love” context”, “2)feel about others”, and “3) feel about themselves with others. sits deep.”
t|And dating apps have not addressed the past or that identity; and have always directed folks to the future, even though past stays heavy, still.
t|Communicate, with subtle messaging, addressing love as a continuous process — though not explicitly in such a way that past itself starts to hurt yet again and people don’t think about new dates at all..
t|So, for a lack of a better word, milder form of “melancholy” is a helper here, for us, as a messaging medium. To forge and continue the steps of love, literally, onto the next.
t|Such a strategy chases an unsaid reality, which you feel when you realise the person you are on a date with, hasn’t moved on. Or are still trying to process, amidst their journey to find a new partner. And so are you. Subconsciously or consciously. At least in some way.
t|Solution: Address that unsaid subcontext with storytelling.
h|Creative
t|“Message to you: See me in everyone and know that I am happy for you.”
t|“Message to you: See me in everyone and know that I am happy for you.” (first part—Continuation of love. Second part— well being assurance.)
t|Acts as a messaging to your ex, that I am in the process of healing and at the same time hoping the best for you; while knowing that love continues, regardless of humans literally changing,places— like a musical chair for life.
t|Portraying love as a continuous chain rather than cuts and joints. A bit philosophical— eternal love and all souls as one.
t|Which, continues the brand image as an app meant to make love feel emotionally healthy.

t|Also posted on Instagram posts as textual letter.

p|(V.O.)
d|Did we die? We didn’t. We both know it. I love him everyday and he’s not you. And was never meant to be.

d|You said to me, “see me in everyone and know that I am happy for you.”
d|You smiled, as you left me— continuing your inhuman gesture of always being altruistic. I call it inhuman because it is too human of you.
d|You died, John. You died putting me at the heights of the sky. All while burying yourself.
d|That wasn’t love. From your side.
d|I know that you made sure, I would continue to do everything I should possibly do to make myself happy, after you would be gone. I cried, and denied that last happiness to you; begging to you that I won’t be, without you.
d|And that is when you lost your smile, John. You were worried. Not at the sight of losing me, but at the feeling that you hadn’t done your part well for our doomsday, in caring for me. That’s what the air felt like around us.

d|And you too, should know today, that I have not said what I could to you and that will, shall stay the same way. “Know that I see you in everyone and I know that you are happy for me.”

h|Brand Manifesto
t|DON’T is a makeup brand formed on the premises of the philosophy of “negation before addition”. Closer to Advaita Vedanta’s “neti-neti” or modern Nassim Taleb’s “via negativa”—where the more reliable way to reach beauty and truth is firstly by eliminating the wrong than adding what we perceive as good. Hence comes the name “DON’T”, which redirects our attention from unnecessary noise to what’s truly important. To reach, or rather, to uncover our beauty.
t|It promotes the practice of conscious makeup, which is done deliberately and not out of the many psychological insecurities or pressures we humans are so prone to. Conscious, not just in checking ingredient lists, but in our usage practices of it, on our face.
t|We think of makeup as a tool of extension. Not as a transformation that turns a person from ugly to beautiful, but more like a garnish on what’s already beautiful in you, and how it radiates from your face.
t|Therefore, we are strictly light makeup focused. We simply don’t sell heavy makeup.
t|But who defines what’s minimal? Something internal does. We see it every time we push it away when it points us to something true about ourselves. When there is an eerie discomfort we feel about our choices. When we don’t oblige with what we truly want. When we artificially try to feel better in the masks we wear.
t|So when the extra shades start to feel too foreign, you know where you went a step ahead.
t|Our effort is for wearing a mask that doesn’t force you to be what the mask is, but to have control over what you want it to be. And that is where the real individual’s voice shines again. Where, as the popular saying goes, the world is a cinema and you are the star. But in our version, the star is both deeply entrenched in the act but also conscious of her part and acting in it. Never letting the world take away what’s true underneath.
t|Then why no makeup at all?
t|Because we don’t see “thoughtful makeup” as camouflaging, or as self denial. It’s a deliberate showoff. Quite opposite to hiding oneself.
t|Culturally, women have participated in the ritual of self care, but when that self care turns into wanting to be someone else, or a version of you that you are not, that’s where we step back.
t|If we closely look at the word “makeup” itself, the implicit interpretation can seem like it is asking for making up for something lost or something that’s already not there. So we have redefined makeup as “touchup”, which tells you everything you need to know about us. When we say we are touching up, there’s already an underlying layer called our natural face, which allows for a bit of cosmetic sparkle on it. Again quite opposite to the general coined use of touching up, which is more makeup on already done makeup.
t|One last thing. Warning for that matter. It is going to be hard. To choose less. To have more accountability. To see people using anything that reads “beauty” and being on the other side of that conversation. To be more open and less reclusive about your face and how you see yourself. To allow the natural fit of yours to be your own, this time. Truly.
h|Strategy
t|Problem: The Indian makeup industry or makeup industry as a whole doesn’t address the problems with the western overconsumption framing of beauty. Which leads to dissatisfaction and exacerbated insecurities women continue to feel— even while using the thing that was intended to fix it.
t|Insight: By explicitly telling the truth, bearing the burden of costly signalling and taking the loss on one’s own revenue by not selling heavy makeup, the brand wouldn’t preach what it stands for but will show it. Such a positioning can’t be faked. With almost no brand holding such strong opposing values against the flux of the hyper-consumerist makeup market, addressing that we have been selling insecurities would be an honest word in the pool of “you look bad, you will look better by using…”.
t|Advantage: differentiation in the industry or clean makeup market specifically, is mainly on metrics like ingredients, clean or natural, skin inclusive etc., and the assumption of “more is better” is implicit in top players’ positioning. What looks like direct competition, in the indian context, for clean brands like Minimalist is in fact not, on a fundamental level. Minimalist is built on transparency on the product ingredients side. DON’T differentiates on the psychology of makeup usage itself and on its philosophy.
t|Strategy: the name “DON’T” holds the negation factor, which makes people have an extreme take on it. Not something you can ignore. Either like the philosophy or feel discomfort around it, because it requires redressal of your own values and choices. The brand picks the niche of women who also oppose the heavy makeup narrative and dislike the scrutiny attached to the act of makeup itself. By framing light makeup as literally the right kind of makeup, the brand takes the one sided risk of redefining what beauty is. It can then continue to hold its radical messaging with its new expected momentum and continue its marketing efforts in this same view.`}
